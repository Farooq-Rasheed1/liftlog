<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0d1017"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="LiftLog"><meta name="description" content="Your personal XTRAFIT training tracker"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>LiftLog · My Gym</title>
<style>
:root{--bg:#0b0e15;--panel:#151b27;--panel2:#1c2533;--line:#30394a;--text:#f4f7fb;--muted:#a4b0c0;--teal:#54e3c1;--teal2:#093f39;--gold:#efba6f;--red:#ff8f9c}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}button{cursor:pointer}input,select,textarea{background:#101723;color:var(--text);border:1px solid var(--line);border-radius:11px;outline:none;min-height:42px;padding:9px}input:focus,select:focus,textarea:focus{border-color:var(--teal)}.shell{max-width:680px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(100px + env(safe-area-inset-bottom))}.header{padding:22px 0 10px;display:flex;justify-content:space-between;align-items:center}.eyebrow{color:var(--teal);font-size:11px;letter-spacing:2px;font-weight:800;text-transform:uppercase}.logo{font-size:25px;font-weight:900;letter-spacing:-1.2px}.logo span{color:var(--teal)}.small{font-size:12px;color:var(--muted)}.heading{font-size:27px;letter-spacing:-1px;font-weight:850;margin:13px 0 3px}.sub{color:var(--muted);margin:0 0 18px}.card{background:var(--panel);border:1px solid #283143;border-radius:19px;padding:16px;margin:13px 0;box-shadow:0 6px 20px #0001}.hero{background:linear-gradient(130deg,#163e3c,#162130 68%);border:1px solid #2c655c}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;background:var(--panel2);color:var(--muted);font-size:12px;font-weight:650}.pill.active{color:var(--teal);background:var(--teal2)}.label{color:var(--muted);font-size:12px}.value{font-size:24px;font-weight:900}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--teal);color:#091d19;font-weight:850;min-height:43px}.btn:active{opacity:.8}.btn.secondary{background:#263242;color:#f5f8fc}.btn.outline{background:transparent;color:var(--teal);border:1px solid #3d7169}.btn.danger{background:#47252d;color:#ffbbc3}.btn.small-btn{padding:8px 12px;min-height:34px;font-size:13px}.btn:disabled{opacity:.35;cursor:default}.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:15px 0}.seg button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:13px;padding:12px 5px;font-weight:800}.seg button.active{background:var(--teal2);border-color:var(--teal);color:var(--teal)}.ex-title{font-size:17px;font-weight:800}.set-head,.set-line{display:grid;grid-template-columns:42px 1fr 1fr 43px;gap:8px;align-items:center}.set-head{font-size:11px;color:var(--muted);margin-top:14px;margin-bottom:6px;text-align:center}.set-line{margin:7px 0}.set-line input{width:100%;font-weight:700;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}.set-no{text-align:center;font-size:13px;color:var(--muted)}.done{height:42px;border-radius:11px;background:#233043;border:1px solid #3a4759;color:#adc0ce;font-size:19px}.done.yes{background:var(--teal);border-color:var(--teal);color:#09211e}.progress{height:8px;background:#293344;border-radius:30px;overflow:hidden}.progress>div{height:100%;background:var(--teal);transition:width .2s}.blocktitle{font-size:19px;font-weight:800;margin-top:24px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#111825f5;border-top:1px solid #334051;display:flex;justify-content:center;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));backdrop-filter:blur(15px);z-index:10}.bottom-inner{width:min(680px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.tab{color:#8997aa;background:none;border:0;padding:6px 3px;min-height:50px;border-radius:12px;font-size:11px;font-weight:750}.tab b{display:block;font-size:22px;line-height:25px;font-weight:400}.tab.on{color:var(--teal);background:#1d3134}.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:var(--panel2);border-radius:12px;padding:13px}.muted{color:var(--muted)}.chart{width:100%;height:180px;display:block}.listitem{padding:12px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.empty{border:1px dashed #435065;padding:25px;text-align:center;border-radius:15px;color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;flex:1}.field label{color:var(--muted);font-size:12px}.field input,.field select{width:100%}.note{border-left:3px solid var(--gold);padding-left:11px;color:var(--muted);font-size:12px;margin:11px 0}.hide{display:none!important}.mono{font-variant-numeric:tabular-nums}.modalwrap{position:fixed;inset:0;background:#000b;z-index:20;display:grid;align-items:end;justify-items:center}.modal{background:#192130;border-radius:22px 22px 0 0;width:min(680px,100%);max-height:83dvh;overflow:auto;padding:22px 17px calc(20px + env(safe-area-inset-bottom))}.modal select{width:100%;margin:12px 0}.modal h2{margin:0 0 8px}.separator{height:1px;background:var(--line);margin:15px 0}.actionlink{color:var(--teal);background:none;border:0;font-size:13px;font-weight:700;padding:7px}.toast{position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#0a2019;background:var(--teal);z-index:30;padding:10px 18px;border-radius:12px;font-weight:750;box-shadow:0 10px 30px #0008;max-width:90vw;text-align:center}.tips{font-size:13px;color:var(--muted);line-height:1.65}.footerhint{font-size:11px;color:#94a2b3;text-align:center;margin-top:20px}@media(min-width:700px){.shell{padding-top:12px}.modalwrap{align-items:center}.modal{border-radius:22px}}
</style></head><body><main class="shell"><header class="header"><div><div class="eyebrow">XTRAFIT BONN · PERSONAL TRACKER</div><div class="logo">Lift<span>Log</span></div></div><span class="pill active" id="statusPill">LOCAL & PRIVATE</span></header><div id="app"></div></main><nav class="bottom"><div class="bottom-inner"><button class="tab on" data-tab="today"><b>◉</b>Workout</button><button class="tab" data-tab="history"><b>▤</b>History</button><button class="tab" data-tab="progress"><b>↗</b>Progress</button><button class="tab" data-tab="settings"><b>⚙</b>Setup</button></div></nav><div id="modalhost"></div><div id="toasthost"></div>
<script src="machine-pictures.js"></script><script>
(()=>{'use strict';
const KEY='liftlog_bonn_v1';
const LIB=[['Chest Press','Chest','machine'],['Incline Chest Press','Chest','machine'],['Lat Pulldown','Back','machine'],['Seated Cable Row','Back','cable'],['Leg Press','Legs','machine'],['Seated Leg Curl','Legs','machine'],['Leg Extension','Legs','machine'],['Biceps Curl','Arms','machine'],['Hammer Curl','Arms','dumbbell'],['Triceps Pushdown','Arms','cable'],['Shoulder Press','Shoulders','machine'],['Lateral Raise','Shoulders','dumbbell'],['Cable Crunch','Core','cable'],['Pec Deck','Chest','machine'],['Dumbbell Bench Press','Chest','dumbbell'],['Plank','Core','bodyweight'],['Romanian Deadlift','Legs','dumbbell']];
const tmpl=[{id:'A',name:'Chest + Biceps',list:[['Chest Press',3,'8–12'],['Lat Pulldown',3,'8–12'],['Leg Press',3,'10–12'],['Seated Cable Row',2,'10–12'],['Biceps Curl',3,'10–12'],['Triceps Pushdown',2,'10–15']]},{id:'B',name:'Back + Legs',list:[['Seated Cable Row',3,'8–12'],['Leg Press',3,'10–12'],['Incline Chest Press',3,'8–12'],['Seated Leg Curl',3,'10–15'],['Hammer Curl',2,'10–12'],['Shoulder Press',2,'10–12']]},{id:'C',name:'Arms + Shoulders',list:[['Chest Press',3,'8–12'],['Lat Pulldown',3,'8–12'],['Leg Press',2,'10–12'],['Seated Leg Curl',2,'10–15'],['Biceps Curl',3,'10–12'],['Lateral Raise',2,'12–15'],['Triceps Pushdown',2,'10–15']]}];
function initial(){return{version:1,selected:'A',next:'A',routines:tmpl,logs:[],drafts:{},body:[],settings:{goalCalories:2000,protein:140},custom:[]}}
let data;try{data=Object.assign(initial(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){data=initial()};if(!Array.isArray(data.routines))data.routines=tmpl;if(!Array.isArray(data.logs))data.logs=[];if(!data.drafts)data.drafts={};if(!Array.isArray(data.body))data.body=[];
let tab='today',plotExercise='Chest Press';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('Storage not available: export a backup')}};const routine=id=>data.routines.find(r=>r.id===id);const today=()=>new Date().toISOString().slice(0,10);const dated=d=>new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});const round=n=>Math.round(n*10)/10;const fmt=n=>Number.isFinite(n)?round(n).toLocaleString():'–';
function toast(msg){$('toasthost').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>{if($('toasthost'))$('toasthost').innerHTML=''},2500)}
function previousWeight(name){for(const log of [...data.logs].reverse())for(const x of log.exercises||[])if(x.name===name){const s=(x.sets||[]).find(z=>Number(z.kg)>0);if(s)return s.kg}return''}
function getDraft(id){if(!data.drafts[id])data.drafts[id]={started:new Date().toISOString(),items:routine(id).list.map(([name,n])=>({name,sets:Array.from({length:n},()=>({kg:previousWeight(name),reps:'',done:false}))})),warm:false,cardio:false,notes:''};return data.drafts[id]}
function setView(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render()}
function render(){if(tab==='today')renderToday();else if(tab==='history')renderHistory();else if(tab==='progress')renderProgress();else renderSetup()}
function renderToday(){const r=routine(data.selected),d=getDraft(r.id),total=d.items.reduce((a,b)=>a+b.sets.length,0),done=d.items.reduce((a,b)=>a+b.sets.filter(s=>s.done).length,0);$('app').innerHTML=`<div class="heading">Today's workout</div><p class="sub">Follow your rotation, record each set, and finish your session.</p><div class="seg">${data.routines.map(x=>`<button data-routine="${x.id}" class="${x.id===r.id?'active':''}">${x.id} · ${x.id==='A'?'Chest':x.id==='B'?'Back':'Arms'}</button>`).join('')}</div><div class="card hero"><div class="row"><div><div class="eyebrow">WORKOUT ${r.id}</div><div style="font-size:23px;font-weight:900">${esc(r.name)}</div><div class="small">5 min warm-up · strength · 8–10 min cardio</div></div><span class="pill active">${done}/${total} sets</span></div><div class="progress" style="margin-top:16px"><div style="width:${total?done/total*100:0}%"></div></div></div><div class="card row"><div><b>Warm-up</b><div class="small">5 minutes of walking or cycling</div></div><button class="btn ${d.warm?'':'secondary'} small-btn" data-warm>${d.warm?'✓ Done':'Mark done'}</button></div>${d.items.map((x,i)=>{const def=r.list[i]||[x.name,x.sets.length,'8–12'];return `<section class="card"><div class="row"><div><div class="small">EXERCISE ${i+1} · ${esc(def[2])} reps target</div><div class="ex-title">${esc(x.name)}</div><div class="small">${x.sets.length} sets · rest ~60–90 sec</div></div><button class="btn secondary small-btn" data-swap="${i}">Swap</button></div><div class="set-head"><span>SET</span><span>KG</span><span>REPS</span><span>✓</span></div>${x.sets.map((s,j)=>`<div class="set-line"><span class="set-no">${j+1}</span><input aria-label="Weight for ${esc(x.name)} set ${j+1}" data-kg="${i}-${j}" type="number" min="0" max="1000" step="0.5" inputmode="decimal" placeholder="kg" value="${esc(s.kg)}"><input aria-label="Reps for ${esc(x.name)} set ${j+1}" data-reps="${i}-${j}" type="number" min="0" max="100" step="1" inputmode="numeric" placeholder="reps" value="${esc(s.reps)}"><button aria-label="Mark set finished" class="done ${s.done?'yes':''}" data-done="${i}-${j}">${s.done?'✓':'○'}</button></div>`).join('')}<div class="row"><button class="actionlink" data-addset="${i}">+ Add set</button>${x.sets.length>1?`<button class="actionlink" data-removeset="${i}">− Remove last</button>`:''}</div></section>`}).join('')}<button class="btn secondary" style="width:100%;margin-top:8px" data-addexercise>+ Add another machine / exercise</button><div class="card row"><div><b>Cardio finisher</b><div class="small">8–10 min incline walk or cycling</div></div><button class="btn ${d.cardio?'':'secondary'} small-btn" data-cardio>${d.cardio?'✓ Done':'Mark done'}</button></div><div class="card"><label class="label" for="notes">Session notes (optional)</label><textarea id="notes" style="width:100%;margin-top:8px;min-height:70px" placeholder="Energy, form, or machine substitutions">${esc(d.notes)}</textarea><p class="note">Only completed sets with both weight and reps are included in your performance stats. Leave warm-up sets unchecked.</p><button class="btn" style="width:100%;font-size:17px" data-finish>Finish & save session</button></div>`}
function renderHistory(){const logs=[...data.logs].sort((a,b)=>new Date(b.ended)-new Date(a.ended));$('app').innerHTML=`<div class="heading">Workout history</div><p class="sub">Every completed session stays here on this device.</p>${logs.length?logs.map(l=>{const count=l.exercises.reduce((s,e)=>s+e.sets.length,0),vol=l.exercises.reduce((s,e)=>s+e.sets.reduce((t,z)=>t+Number(z.kg)*Number(z.reps),0),0);return `<div class="card"><div class="row"><div><div class="small">${dated(l.ended)}</div><div class="ex-title">Workout ${esc(l.routine)} · ${esc(l.name)}</div></div><span class="pill active">${count} sets</span></div><div class="row" style="margin-top:8px"><span class="small">${esc(l.exercises.map(e=>e.name).join(' · '))}</span></div><div class="row" style="margin-top:12px"><b>${fmt(vol)} kg volume</b><button class="btn secondary small-btn" data-details="${esc(l.id)}">Details</button></div></div>`}).join(''):'<div class="empty">No saved sessions yet. Complete Workout A, B, or C to begin.</div>'}`}
function allExerciseNames(){return [...new Set([...LIB.map(x=>x[0]),...data.custom,...data.logs.flatMap(l=>l.exercises.map(e=>e.name)),...data.routines.flatMap(r=>r.list.map(x=>x[0]))])].sort()}
function renderProgress(){const logs=data.logs;const best={};for(const l of logs)for(const x of l.exercises)for(const s of x.sets){const kg=Number(s.kg),reps=Number(s.reps);if(kg>0&&reps>0){const score=kg*(1+Math.min(reps,30)/30);if(!best[x.name]||score>best[x.name].score)best[x.name]={score,kg,reps}}}const totalVol=logs.reduce((a,l)=>a+l.exercises.reduce((t,e)=>t+e.sets.reduce((v,s)=>v+Number(s.kg)*Number(s.reps),0),0),0);const names=allExerciseNames();$('app').innerHTML=`<div class="heading">Your progress</div><p class="sub">Track strength, training consistency and body weight.</p><div class="statgrid"><div class="stat"><div class="label">Sessions</div><div class="value">${logs.length}</div></div><div class="stat"><div class="label">Total training volume</div><div class="value">${fmt(totalVol)}<span class="small"> kg</span></div></div></div><div class="card"><b>Strength trend</b><p class="small">Best estimated one-rep max for an exercise per session; useful for trends, not an actual max-lift target.</p><select id="chartExercise" aria-label="Choose exercise" style="width:100%;margin:8px 0">${names.map(n=>`<option ${n===plotExercise?'selected':''}>${esc(n)}</option>`).join('')}</select><svg class="chart" id="strengthChart" viewBox="0 0 340 180" role="img" aria-label="Strength progress chart"></svg><div id="chartCaption" class="small"></div></div><div class="card"><b>Personal bests</b>${Object.entries(best).length?Object.entries(best).sort((a,b)=>a[0].localeCompare(b[0])).map(([name,val])=>`<div class="row listitem"><span style="font-size:13px">${esc(name)}</span><span class="mono"><b>${fmt(val.kg)} kg</b><span class="small"> × ${val.reps}</span></span></div>`).join(''):'<p class="small">Finish a session to see your best lifts.</p>'}</div><div class="card"><b>Body-weight tracker</b><p class="small">Log morning weight about 3 times per week. Compare weekly averages, not day-to-day fluctuations.</p><div class="row"><input type="date" id="bodyDate" value="${today()}" style="min-width:0;flex:1"><input type="number" id="bodyWeight" min="25" max="350" step="0.1" inputmode="decimal" placeholder="kg" style="min-width:0;width:90px"><button class="btn" data-bodyadd>Save</button></div>${data.body.length?`<div class="separator"></div>${[...data.body].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(x=>`<div class="row listitem"><span>${esc(x.date)}</span><b>${fmt(x.kg)} kg</b></div>`).join('')}`:''}<p class="note">At 78 kg, aim for slow fat loss (~0.2–0.4 kg/week) if your waist is not shrinking. Reassess after 2–3 weeks before changing your ~2,000 kcal starting target.</p></div>`;drawChart()}
function drawChart(){let pts=[];for(const l of [...data.logs].sort((a,b)=>new Date(a.ended)-new Date(b.ended))){let max=0;for(const x of l.exercises)if(x.name===plotExercise)for(const s of x.sets)max=Math.max(max,Number(s.kg)*(1+Number(s.reps)/30));if(max>0)pts.push({date:l.ended.slice(0,10),v:max})}const svg=$('strengthChart'),cap=$('chartCaption');if(!svg)return;if(!pts.length){svg.innerHTML='<text x="170" y="90" fill="#a4b0c0" text-anchor="middle" font-size="13">No recorded sets for this exercise yet</text>';cap.textContent='';return}const min=Math.floor(Math.min(...pts.map(p=>p.v))*0.9),max=Math.ceil(Math.max(...pts.map(p=>p.v))*1.1)||1,delta=Math.max(1,max-min);const coords=pts.map((p,i)=>[25+(pts.length===1?145:i*285/(pts.length-1)),155-(p.v-min)/delta*125]);svg.innerHTML=`<line x1="25" y1="155" x2="320" y2="155" stroke="#586476"/><line x1="25" y1="25" x2="25" y2="155" stroke="#586476"/><text x="1" y="32" font-size="10" fill="#a4b0c0">${max}</text><text x="1" y="155" font-size="10" fill="#a4b0c0">${min}</text><polyline fill="none" stroke="#54e3c1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${coords.map(p=>p.join(',')).join(' ')}"/>${coords.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#54e3c1"/>`).join('')}`;cap.textContent=`${pts.length} session(s) · First ${fmt(pts[0].v)} kg → Latest ${fmt(pts.at(-1).v)} kg (estimated 1RM)`}
function renderSetup(){$('app').innerHTML=`<div class="heading">Your setup</div><p class="sub">Personalize your program and protect your progress.</p><div class="card"><b>Program</b><p class="small">A → B → C, regardless of weekday. Your next planned workout is <b>${esc(data.next)}</b>.</p><p class="tips">Workouts include chest, back, legs and arms, with extra biceps work. Aim for 2–3 days each week, with a recovery day between sessions.</p><button class="btn secondary small-btn" data-resetplan>Reset routines to defaults</button></div><div class="card"><b>Nutrition goals</b><div class="row" style="margin-top:12px"><div class="field"><label>Calories/day</label><input id="calGoal" type="number" value="${esc(data.settings.goalCalories||2000)}"></div><div class="field"><label>Protein/day (g)</label><input id="protGoal" type="number" value="${esc(data.settings.protein||140)}"></div></div><button class="btn secondary small-btn" data-goals style="margin-top:10px">Save goals</button><p class="note">These are reminders, not a food diary. Your starting calorie target should be adjusted using 2–3 week weight and waist trends.</p></div><div class="card"><b>Backup & restore</b><p class="tips">All workouts are stored locally in this browser, not on a cloud account. Export regular backups—clearing Safari data or switching phones can erase locally stored logs.</p><div class="row wrap"><button class="btn" data-export>Export backup</button><button class="btn secondary" data-import>Import backup</button></div><input class="hide" id="fileImport" type="file" accept="application/json,.json"></div><div class="card"><b>Add to your iPhone Home Screen</b><ol class="tips"><li>Publish this web app with HTTPS (for example, GitHub Pages).</li><li>Open the resulting website in <b>Safari</b>.</li><li>Tap <b>Share → Add to Home Screen → Add</b>.</li><li>Launch the LiftLog icon from your Home Screen.</li></ol><p class="small">Once installed, previously loaded app files can work offline. Your data stays on that device and in that installed app's local storage.</p></div><div class="card"><b>Manage data</b><p class="small">Export a backup before deleting anything.</p><button class="btn danger small-btn" data-clear>Delete all local workout data</button></div><div class="footerhint">Made for your XTRAFIT Bonn routine · No login · No tracking SDK</div>`}
function openModal(inner){$('modalhost').innerHTML=`<div class="modalwrap" id="modalBackdrop"><div class="modal"><div class="row"><h2>Exercise options</h2><button class="btn secondary small-btn" data-close>Close</button></div>${inner}</div></div>`}
function chooseExercise(i,add){openModal(`<p class="small">Select an exercise or type the name of a new machine.</p><select id="chooseEx">${allExerciseNames().map(s=>`<option>${esc(s)}</option>`).join('')}</select><input id="customEx" placeholder="Or enter custom machine name" style="width:100%"><div class="row" style="margin-top:14px"><button class="btn" data-choose="${i}" data-add="${add?'1':'0'}">Use this exercise</button></div>`)}
function saveSession(){const d=getDraft(data.selected),r=routine(data.selected);const exercises=d.items.map(x=>({name:x.name,sets:x.sets.filter(s=>s.done&&Number(s.kg)>0&&Number(s.reps)>0).map(s=>({kg:Number(s.kg),reps:Number(s.reps)}))})).filter(x=>x.sets.length);if(!exercises.length){toast('Mark at least one weighted set complete');return}const l={id:'s'+Date.now(),routine:r.id,name:r.name,started:d.started,ended:new Date().toISOString(),exercises,warm:d.warm,cardio:d.cardio,notes:d.notes};data.logs.push(l);delete data.drafts[r.id];data.next={A:'B',B:'C',C:'A'}[r.id];data.selected=data.next;save();toast('Session saved! Next: Workout '+data.next);setView('history')}
function showDetails(id){const l=data.logs.find(x=>x.id===id);if(!l)return;openModal(`<p class="small">${dated(l.ended)} · Workout ${esc(l.routine)}</p>${l.exercises.map(x=>`<div class="listitem"><b>${esc(x.name)}</b><p class="small">${x.sets.map(s=>`${fmt(s.kg)} kg × ${s.reps}`).join(' · ')}</p></div>`).join('')}<p class="small">${esc(l.notes||'No notes')}</p><button class="btn danger small-btn" data-del-log="${esc(l.id)}">Delete this session</button>`)}
function exportBackup(){const str=JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2),blob=new Blob([str],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`LiftLog-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Backup downloaded')}
function importBackup(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(reader.result);if(!Array.isArray(incoming.logs)||!Array.isArray(incoming.routines)||!incoming.drafts)throw Error('Not a LiftLog backup');if(!confirm('Replace all current data with this backup?'))return;data={...initial(),...incoming};save();setView('today');toast('Backup restored')}catch(e){alert('Could not import this file: '+e.message)}};reader.readAsText(file)}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const d=el.dataset;if(d.tab){setView(d.tab);return}if(d.routine){data.selected=d.routine;save();render();return}if('warm'in d){getDraft(data.selected).warm=!getDraft(data.selected).warm;save();render();return}if('cardio'in d){getDraft(data.selected).cardio=!getDraft(data.selected).cardio;save();render();return}if(d.done){const [i,j]=d.done.split('-').map(Number),s=getDraft(data.selected).items[i].sets[j];s.done=!s.done;save();render();return}if(d.addset){const x=getDraft(data.selected).items[+d.addset];x.sets.push({kg:x.sets.at(-1)?.kg||'',reps:'',done:false});save();render();return}if(d.removeset){const x=getDraft(data.selected).items[+d.removeset];if(x.sets.length>1)x.sets.pop();save();render();return}if(d.swap){chooseExercise(+d.swap,false);return}if('addexercise'in d){chooseExercise(-1,true);return}if(d.choose!==undefined){const name=String($('customEx').value.trim()||$('chooseEx').value).slice(0,70);if(!name)return;const draft=getDraft(data.selected),r=routine(data.selected);if(d.add==='1'){draft.items.push({name,sets:[{kg:previousWeight(name),reps:'',done:false},{kg:previousWeight(name),reps:'',done:false}]});r.list.push([name,2,'8–12'])}else{const i=+d.choose;draft.items[i]={name,sets:draft.items[i].sets.map(s=>({...s,kg:previousWeight(name),reps:'',done:false}))};r.list[i][0]=name}if(!allExerciseNames().includes(name))data.custom.push(name);save();$('modalhost').innerHTML='';render();return}if('close'in d){$('modalhost').innerHTML='';return}if('finish'in d){saveSession();return}if(d.details){showDetails(d.details);return}if(d['delLog']){if(confirm('Delete this session permanently?')){data.logs=data.logs.filter(x=>x.id!==d['delLog']);save();$('modalhost').innerHTML='';render()}return}if('bodyadd'in d){const kg=Number($('bodyWeight').value),date=$('bodyDate').value;if(!(kg>25&&kg<350&&date)){toast('Enter a valid date and weight');return}data.body=data.body.filter(x=>x.date!==date);data.body.push({date,kg});save();render();toast('Weight logged');return}if('goals'in d){data.settings.goalCalories=Number($('calGoal').value)||2000;data.settings.protein=Number($('protGoal').value)||140;save();toast('Goals saved');return}if('export'in d){exportBackup();return}if('import'in d){$('fileImport').click();return}if('resetplan'in d){if(confirm('Reset routine exercises to their original structure? Your completed session history will stay. Current unfinished drafts will be cleared.')){data.routines=JSON.parse(JSON.stringify(tmpl));data.drafts={};save();render()}return}if('clear'in d){if(confirm('Permanently delete all local data? Make a backup first.')){localStorage.removeItem(KEY);data=initial();save();setView('today')}return}});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.kg||d.reps){const [i,j]=(d.kg||d.reps).split('-').map(Number);const s=getDraft(data.selected).items[i].sets[j];s[d.kg?'kg':'reps']=e.target.value;save()}if(e.target.id==='notes'){getDraft(data.selected).notes=e.target.value;save()}});document.addEventListener('change',e=>{if(e.target.id==='chartExercise'){plotExercise=e.target.value;drawChart()}if(e.target.id==='fileImport')importBackup(e.target.files[0])});if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
})();
</script></body></html>
